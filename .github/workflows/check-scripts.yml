# Minimal CI for a repo that had none.
#
# 187 R scripts reached `main` with nothing automated checking them. A syntax
# error in form_ratings.R - the engine every rating comes from - would have been
# found by a human running it, days later. Parsing needs no packages installed,
# so there is no excuse for not doing it on every push.
#
# The second job scans for the specific mistakes this repo has actually made,
# not generic lint. Each pattern below cost real time or produced a wrong
# published number at least once. It reports and does not fail, because every one
# of them has legitimate uses - the point is that they appear in a diff rather
# than in a ranking. It found a live one the day it landed: a Birmingham forecast
# asserted `max(past$date, na.rm = TRUE) < MEET_START` to prove it had not seen
# the competition it predicts, which on an empty history is -Inf < MEET_START and
# passes while verifying nothing.
#
# WHY THE SCAN USES grep AND NOT R. It was written as an Rscript step first, and
# r-lib/actions/setup-r hung for over 40 minutes on that job across three
# consecutive runs while completing in seconds on the parse job beside it. The
# scan is pure text matching and the patterns are already POSIX extended regex,
# which grep -E speaks natively - so the R dependency bought nothing and cost the
# job. Removing it also makes this job finish in about a second.
#
# NOTE ON THE PATTERNS: they deliberately contain no backslashes, using [[] for a
# literal bracket and [[:space:]] for whitespace. An earlier version used escapes
# that lost a level on the way into this file and would have failed on first run.
name: check-scripts

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  parse:
    name: Every R script parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse all R scripts
        shell: Rscript {0}
        run: |
          files <- list.files(c("scripts", "R"), pattern = "[.][Rr]$",
                              full.names = TRUE, recursive = TRUE)
          # A run that parses zero files is a pass proving nothing - the exact
          # vacuous-guard failure this repo keeps hitting. 188 scripts today.
          stopifnot("fewer than 50 R scripts found - check the paths" =
                      length(files) >= 50)
          cat(sprintf("parsing %d R scripts\n", length(files)))
          bad <- character(0)
          for (f in files) {
            e <- tryCatch({ parse(f); NULL }, error = function(e) conditionMessage(e))
            if (!is.null(e)) bad <- c(bad, sprintf("%s\n    %s", f, e))
          }
          if (length(bad)) {
            cat(sprintf("\n%d script(s) FAILED to parse:\n\n", length(bad)))
            cat(paste(bad, collapse = "\n\n"), "\n")
            quit(status = 1)
          }
          cat(sprintf("all %d scripts parse\n", length(files)))

  footguns:
    name: Scan for this repo's known footguns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report patterns that have bitten before
        shell: bash
        run: |
          set -uo pipefail
          n_files=$(find scripts -name '*.R' -o -name '*.r' | wc -l)
          echo "scanning $n_files R scripts under scripts/ (recursively)"
          # A scan of zero files is a pass proving nothing.
          if [ "$n_files" -lt 50 ]; then
            echo "FAIL: only $n_files scripts found - check the path"; exit 1
          fi

          total=0
          scan() {
            local why="$1" re="$2"
            # -v on the comment filter drops commented-out code; the || true keeps
            # a no-match (grep exit 1) from ending the step under pipefail.
            local hits
            hits=$(grep -rEn --include='*.R' --include='*.r' -- "$re" scripts \
                   | grep -vE ':[[:space:]]*#' || true)
            if [ -n "$hits" ]; then
              local n; n=$(printf '%s\n' "$hits" | wc -l)
              total=$((total + n))
              echo ""
              echo "$why"
              printf '%s\n' "$hits" | head -15 | sed 's/^/  /'
              [ "$n" -gt 15 ] && echo "  ... and $((n - 15)) more"
            fi
          }

          scan "1:n indexing. On an empty table 1:0 is c(1, 0), so this FABRICATES a row of NA instead of returning nothing - it printed eight fully-formed NA rows once. Use seq_len()." \
               '[[]1:[A-Za-z0-9]'
          scan "sum(x, na.rm = TRUE) == 0 is satisfied when x is entirely NA. Assert the column is populated before trusting it." \
               'na[.]rm[[:space:]]*=[[:space:]]*TRUE[^)]*[)][[:space:]]*==[[:space:]]*0'
          scan "max(numeric(0)) is -Inf, which satisfies any upper bound - for < just as much as <=. Assert nrow/length first or the guard cannot fail." \
               'max[(][^)]*[)][[:space:]]*<=?'
          scan "uniqueN(c(NA, NA)) is 1, not 0 - a filter written this way never fired, and events with zero elite races escaped it." \
               'uniqueN[(][^)]*[)][[:space:]]*==[[:space:]]*0'

          echo ""
          echo "$total occurrence(s) of known footgun patterns."
          echo "Reported, not failed: each has legitimate uses. The point is that"
          echo "they show up in a diff rather than in a wrong published number."
          echo ""
          echo "Note: this flags the PATTERN, not a confirmed bug. A line already"
          echo "guarded - a max() preceded by an nrow() check, say - still appears"
          echo "here. Read the surrounding lines before changing anything."
